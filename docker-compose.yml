services:

  db:
    image: postgres:16-alpine
    container_name: dangame-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-detective}
      POSTGRES_USER:     ${POSTGRES_USER:-detective}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detective_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-detective} -d ${POSTGRES_DB:-detective}"]
      interval: 5s
      timeout:  5s
      retries:  10

  backend:
    build: ./backend
    container_name: dangame-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB:-detective}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-detective}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-detective_pass}
    networks:
      - internal

  frontend:
    build: ./frontend
    container_name: dangame-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
