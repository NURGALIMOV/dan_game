plugins {
    id 'java'
    id 'org.springframework.boot'           version '3.3.5'
    id 'io.spring.dependency-management'    version '1.1.6'
}

group   = 'com.dangame.detective'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    mapstructVersion       = '1.6.3'
    lombokVersion          = '1.18.34'
    lombokMapstructBinding = '0.2.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.security:spring-security-crypto:6.3.4'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly    'org.postgresql:postgresql:42.7.4'

    // ─── Lombok ─────────────────────────────────────────────────────────
    compileOnly         "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // ─── MapStruct (must be declared AFTER lombok so processors run in order) ──
    implementation      "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBinding}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        "-Amapstruct.defaultComponentModel=spring",
        "-Amapstruct.unmappedTargetPolicy=IGNORE"
    ]
}

tasks.named('bootRun') {
    systemProperty 'file.encoding', 'UTF-8'
}
