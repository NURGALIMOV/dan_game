server:
  port: 8000

spring:
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/detective}
    username: ${SPRING_DATASOURCE_USERNAME:detective}
    password: ${SPRING_DATASOURCE_PASSWORD:detective_pass}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    org.hibernate.SQL: WARN
    liquibase:         INFO
